<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platera</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <!-- Logo, Navigation, Cart -->
         <a href="/" class="logo">Platera</a>

         <nav>
            <a href="#">Menu</a>
            <a href="#">About</a>
         </nav>

         <button class="cart-button" type="button">
            Cart
         </button>
    </header>

    <main>

        <section class="hero">
            <!-- Heading, Description, Search -->
             <h1>Good food, made simple.</h1>

             <p>
                Order your favorite meals and have them delivered to your door.
             </p>

             <form class="search-form">
                
                <label for="food-search">Search for food</label>

                <input 
                    type="search"
                    id="food-search"
                    name="q"
                    placeholder="Search for food..."
                >

                <button type="submit">Search</button>
             </form>
        </section>

        <section class="categories">
            <!-- All, Pizza, Burgers, Pasta, Drinks -->
             <h2>Browse categories</h2>

             <div class="category-list">
                <button type="button" data-category="all">All</button>
                <button type="button" data-category="pizza">Pizza</button>
                <button type="button" data-category="burgers">Burgers</button>
                <button type="button" data-category="pasta">Pasta</button>
                <button type="button" data-category="drinks">Drinks</button>
             </div>
        </section>

        <section class="food">
            <!-- Food cards -->
            <h2>Popular dishes</h2>

            <div class="food-grid">
                
            </div>
        </section>
    </main>

    <section class="cart-panel hidden">
    <h2>Your cart</h2>

    <div class="cart-items"></div>

    <p class="cart-total">Total: €0.00</p>

    <button class="checkout-button" type="button">
    Checkout
    </button>
    </section>

    <section
    class="checkout-panel hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="checkout-title">
    <div class="checkout-content">
        <button
            class="checkout-close"
            type="button"
            aria-label="Close checkout">
            ×
        </button>

        <h2 id="checkout-title">Checkout</h2>

        <div class="checkout-summary"></div>

        <form class="checkout-form">
            <label for="customer-name">Name</label>
            <input
                type="text"
                id="customer-name"
                required
            >

            <label for="customer-address">Address</label>
            <input
                type="text"
                id="customer-address"
                required
            >

            <label for="customer-email">Email</label>
            <input
                type="email"
                id="customer-email"
                required
            >

            <button type="submit">
                Place order
            </button>
        </form>

        <p class="order-message"></p>
        </div>
    </section>

    <footer>
        <!-- Footer content -->
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
